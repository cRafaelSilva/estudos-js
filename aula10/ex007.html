<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font: normal 18pt Arial;
      }
      input {
        font: bold 16pt monospace;
        width: 100px;
      }
      div#res {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Somando valores</h1>
    <input type="number" name="txtn1" id="txtn1" />
    <input type="number" name="txtn2" id="txtn2" />
    <input type="button" value="Somar" onClick="somar()" />
    <div id="res">Resultado</div>
    <script>
      var num_1 = Number(document.querySelector("input#txtn1"));
      var num_2 = Number(document.querySelector("input#txtn2"));

      function somar() {
        var tn1 = document.getElementById("txtn1"); //ambos funcionam usar o querySelector é uma boa pratica
        var tn2 = document.querySelector("input#txtn2"); //ambos funcionam usar o querySelector é uma boa pratica
        var res = document.querySelector("div#res");
        var n1 = Number(tn1.value);
        var n2 = Number(tn2.value);
        var s = n1 + n2;
        res.innerHTML = `A Soma entre ${n1} e ${n2} é igual a <strong>${s}</strong>`;
      }
    </script>
  </body>
</html>
